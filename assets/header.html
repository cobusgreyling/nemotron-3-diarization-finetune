<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Header</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1600px;
      height: 1000px;
      overflow: hidden;
      background: #f3ecdf;
      color: #1b1916;
    }
    .page {
      box-sizing: border-box;
      width: 1600px;
      height: 1000px;
      padding: 36px 40px 32px;
    }
    .kicker {
      margin: 0;
      font-family: "Avenir Next", "Avenir", "Helvetica Neue", sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #9c4d2b;
    }
    h1 {
      margin: 8px 0 0;
      font-family: "Iowan Old Style", "New York", Palatino, serif;
      font-weight: 400;
      font-size: 58px;
      line-height: 0.95;
      letter-spacing: -0.03em;
    }
    .deck {
      margin: 10px 0 18px;
      font-family: "Iowan Old Style", "New York", Palatino, serif;
      font-style: italic;
      font-size: 22px;
      color: #3f3a34;
    }
    img {
      display: block;
      width: 1520px;
      height: 760px;
      object-fit: cover;
      object-position: center 45%;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="kicker">Nemotron 3 Diarization</div>
    <h1>Fine-tuning the speaker head.</h1>
    <p class="deck">Three voices, known overlap, one measured DER.</p>
    <img src="scene.jpg" alt="Three crossing voice waveforms in lime, teal, and rust">
  </div>
</body>
</html>
